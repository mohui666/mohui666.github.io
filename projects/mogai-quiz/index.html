<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>毛概选择题交互练习</title><link rel='stylesheet' href='style.css'></head><body><div class='w'><p><a href='../../index.html'>← 返回主页</a></p><section class='hero'><h1>毛概选择题交互练习</h1><p class='sub'>307 道选择题。按章节筛选，单选/多选即时判分；提交后显示答案与解析；错题记录保存在本机浏览器。</p></section><div class='grid'><aside class='side'><b>练习控制</b><label>章节</label><select id='ch'></select><label>题型</label><select id='ty'><option value='all'>全部题型</option><option value='s'>单选</option><option value='m'>多选</option></select><label>状态</label><select id='st'><option value='all'>全部题目</option><option value='u'>未做</option><option value='w'>错题</option><option value='c'>做对</option></select><label>搜索</label><input id='kw' placeholder='输入关键词'><div class='b'><button class='p' id='rand'>随机</button><button class='g' id='seq'>顺序</button><button class='g' id='rev'>显示答案</button><button class='d' id='clr'>清空</button></div><div class='stats'><div class='stat'><b id='n1'>0</b><span class='muted'>已做</span></div><div class='stat'><b id='n2'>0</b><span class='muted'>正确</span></div><div class='stat'><b id='n3'>0</b><span class='muted'>错题</span></div><div class='stat'><b id='n4'>0%</b><span class='muted'>正确率</span></div></div><div class='bar0'><div id='bar'></div></div></aside><main><div id='list' class='list'><div class='empty'>正在加载题库……</div></div></main></div></div><script src='app.js'></script></body></html>
