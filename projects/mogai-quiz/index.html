<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛概选择题交互练习｜mohui666</title><style>
/* ===== 毛玻璃设计令牌（与 css/style.css、css/subpage.css 保持一致） ===== */
:root{
  --bg:#0c1122;
  --ink:#f4f6fb;
  --muted:rgba(226,232,246,0.68);
  --glass:rgba(255,255,255,0.08);
  --glass-soft:rgba(255,255,255,0.05);
  --glass-strong:rgba(255,255,255,0.13);
  --glass-border:rgba(255,255,255,0.16);
  --glass-border-bright:rgba(255,255,255,0.32);
  --accent:#a5b4fc;
  --accent-2:#7dd3fc;
  --accent-3:#f0abfc;
  --radius-lg:28px;
  --radius-md:20px;
  --radius-sm:14px;
  --blur:blur(26px) saturate(1.6);
  --shadow:0 24px 60px rgba(3,7,22,0.45);
  --inner-light:inset 0 1px 0 rgba(255,255,255,0.22),inset 0 -1px 0 rgba(255,255,255,0.05);
  --ease:cubic-bezier(0.22,0.9,0.3,1);
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  color:var(--ink);
  background-color:var(--bg);
  font-family:"Inter","SF Pro Display","Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
/* 底色渐变 + 氛围光晕 */
body::before{
  position:fixed;
  inset:0;
  z-index:-2;
  content:"";
  pointer-events:none;
  background:
    radial-gradient(42rem 30rem at 84% -6%,rgba(125,211,252,0.15),transparent 65%),
    radial-gradient(40rem 30rem at -8% 104%,rgba(240,171,252,0.12),transparent 65%),
    radial-gradient(34rem 26rem at 52% 46%,rgba(165,180,252,0.08),transparent 70%),
    linear-gradient(160deg,#141b36,#0c1122 55%,#141028);
}
::selection{color:#101430;background:var(--accent)}
:focus-visible{outline:2px solid rgba(255,255,255,0.65);outline-offset:3px;border-radius:6px}
.w{max-width:1180px;margin:auto;padding:24px 14px 70px}
a{color:var(--accent-2);text-decoration:none;transition:color 220ms ease}
a:hover,a:focus-visible{color:#ffffff}
/* 顶部导航链接 → 玻璃药丸 */
.w>p:first-of-type{margin:0 0 18px;color:var(--muted)}
.w>p:first-of-type a{
  display:inline-flex;
  align-items:center;
  min-height:40px;
  padding:8px 18px;
  border:1px solid var(--glass-border);
  border-radius:999px;
  color:var(--ink);
  font-size:0.92rem;
  font-weight:600;
  background:var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  transition:transform 220ms var(--ease),background 220ms ease,border-color 220ms ease,color 220ms ease;
}
.w>p:first-of-type a:hover,
.w>p:first-of-type a:focus-visible{
  transform:translateY(-2px);
  border-color:var(--glass-border-bright);
  background:var(--glass-strong);
  color:var(--ink);
}
/* ===== 毛玻璃面板基底 ===== */
.hero,.side,.card{
  border:1px solid var(--glass-border);
  background:linear-gradient(150deg,rgba(255,255,255,0.13),rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.09));
  box-shadow:var(--shadow),var(--inner-light);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border-radius:var(--radius-lg);
}
/* 题目卡片数量多，用稍轻的模糊保证滚动流畅 */
.card{
  border-radius:var(--radius-md);
  box-shadow:0 14px 34px rgba(3,7,22,0.3),var(--inner-light);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
}
/* 不支持 backdrop-filter 时的回退底色 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hero,.side,.card{background:rgba(18,24,46,0.88)}
}
.hero{position:relative;padding:clamp(24px,4vw,40px);margin-bottom:18px;overflow:hidden}
/* 玻璃顶部斜向高光 */
.hero::before{
  position:absolute;
  inset:0;
  content:"";
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0.13),rgba(255,255,255,0) 40%);
  border-radius:inherit;
}
h1{
  margin:0 0 10px;
  font-size:clamp(28px,4vw,46px);
  font-weight:800;
  line-height:1.1;
  letter-spacing:-0.03em;
  color:transparent;
  background:linear-gradient(95deg,var(--accent-2),var(--accent) 48%,var(--accent-3));
  background-clip:text;
  -webkit-background-clip:text;
  filter:drop-shadow(0 4px 20px rgba(165,180,252,0.32));
}
.sub,.muted{color:var(--muted)}
.hero .sub{max-width:720px;margin-bottom:0;font-size:1.02rem;line-height:1.9}
.grid{display:grid;grid-template-columns:295px 1fr;gap:16px}
/* ===== 侧栏控制面板 ===== */
.side{position:sticky;top:14px;align-self:start;padding:18px}
.side>b{display:block;font-size:15px;font-weight:800;letter-spacing:0.02em}
label{
  display:block;
  margin:12px 0 6px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.08em;
}
select,input{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  background:var(--glass-soft);
  color:var(--ink);
  font:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
  transition:border-color 220ms ease,background 220ms ease;
}
select:hover,input:hover{border-color:var(--glass-border-bright)}
select:focus-visible,input:focus-visible{border-color:rgba(255,255,255,0.5);background:var(--glass)}
select option{color:var(--ink);background:#141b36}
input::placeholder{color:rgba(226,232,246,0.6)}
/* ===== 按钮：玻璃药丸 ===== */
button{
  border:1px solid var(--glass-border-bright);
  border-radius:999px;
  padding:10px 14px;
  font:inherit;
  font-weight:700;
  letter-spacing:0.02em;
  cursor:pointer;
  color:var(--ink);
  background:var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  transition:transform 220ms var(--ease),background 220ms ease,border-color 220ms ease,box-shadow 220ms ease,color 220ms ease;
}
button:hover:not(:disabled),
button:focus-visible{
  transform:translateY(-2px);
  background:var(--glass-strong);
  border-color:rgba(255,255,255,0.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 12px 30px rgba(3,7,22,0.35);
}
button:disabled{cursor:not-allowed}
.b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* 主按钮：白玻璃 */
.p{
  color:#101430;
  border-color:transparent;
  background:linear-gradient(180deg,#ffffff,#e6ecff);
  box-shadow:0 14px 34px rgba(10,16,40,0.4),inset 0 1px 0 rgba(255,255,255,0.9);
}
.p:hover:not(:disabled),
.p:focus-visible{
  color:#101430;
  border-color:transparent;
  background:#ffffff;
  box-shadow:0 18px 44px rgba(10,16,40,0.5),inset 0 1px 0 #ffffff;
}
.p:disabled{opacity:0.55}
/* 次按钮：普通玻璃 */
.g{color:var(--ink);border-color:var(--glass-border-bright);background:var(--glass)}
/* 危险按钮：红玻璃 */
.d{
  color:#fecaca;
  border-color:rgba(248,113,113,0.4);
  background:rgba(248,113,113,0.12);
}
.d:hover:not(:disabled),
.d:focus-visible{
  background:rgba(248,113,113,0.2);
  border-color:rgba(252,165,165,0.6);
}
/* ===== 统计卡片 ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.stat{
  padding:10px 12px;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  background:var(--glass-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
}
.stat b{
  display:block;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
  color:transparent;
  background:linear-gradient(95deg,var(--accent-2),var(--accent) 60%,var(--accent-3));
  background-clip:text;
  -webkit-background-clip:text;
}
/* 进度条 */
.bar0{
  height:10px;
  margin-top:14px;
  border:1px solid var(--glass-border);
  border-radius:999px;
  background:var(--glass-soft);
  box-shadow:inset 0 1px 2px rgba(3,7,22,0.4);
  overflow:hidden;
}
#bar{
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent) 55%,var(--accent-3));
  box-shadow:0 0 12px rgba(165,180,252,0.55);
  transition:width 420ms var(--ease);
}
/* ===== 题目卡片 ===== */
.list{display:grid;gap:14px}
.card{overflow:hidden}
.hd{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:16px 18px 6px;
  font-weight:800;
  letter-spacing:-0.01em;
}
.tag{
  align-self:flex-start;
  padding:3px 10px;
  border:1px solid rgba(125,211,252,0.4);
  border-radius:999px;
  color:var(--accent-2);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  background:rgba(125,211,252,0.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
}
.q{padding:0 18px 12px;font-size:17px}
.ops{display:grid;gap:8px;padding:0 18px 16px}
/* 选项：小玻璃条（数量多，关闭自身模糊保证性能） */
.op{
  display:flex;
  gap:10px;
  align-items:flex-start;
  text-align:left;
  border-radius:var(--radius-sm);
  border:1px solid var(--glass-border);
  background:var(--glass-soft);
  color:var(--ink);
  font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
.op:hover:not(:disabled),.sel{
  transform:none;
  border-color:rgba(165,180,252,0.65);
  background:rgba(165,180,252,0.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.16);
}
.op i{
  font-style:normal;
  font-weight:800;
  min-width:26px;
  height:26px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid var(--glass-border);
  border-radius:8px;
  background:rgba(255,255,255,0.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.2);
}
/* 判分高亮：绿=正确 红=错误 */
.ok{background:rgba(74,222,128,0.16)!important;border-color:rgba(74,222,128,0.55)!important}
.bad{background:rgba(248,113,113,0.16)!important;border-color:rgba(248,113,113,0.6)!important}
.act{padding:0 18px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.res{margin-left:auto;font-weight:800}
.yes{color:#86efac;text-shadow:0 0 14px rgba(134,239,172,0.4)}
.no{color:#fca5a5;text-shadow:0 0 14px rgba(252,165,165,0.35)}
/* 解析区 */
.exp{
  display:none;
  padding:14px 18px;
  border-top:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.04);
}
.ans{font-weight:800;color:var(--accent-3)}
.done .exp{display:block}
.empty{
  padding:32px;
  border:1px dashed var(--glass-border-bright);
  border-radius:var(--radius-md);
  text-align:center;
  color:var(--muted);
  background:var(--glass-soft);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
}
@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .side{position:relative;top:0}
  .hd{flex-direction:column}
  .res{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  a,button,select,input,#bar{transition:none}
}
