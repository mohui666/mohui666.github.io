<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Infinite Pannable Canvas 无限平移画布：拖动或滚轮探索一张没有边界的视觉索引。">
    <meta name="theme-color" content="#080b10">
    <link rel="icon" href="../../images/cover.ico" type="image/x-icon">
    <link rel="stylesheet" href="../space-lab.css?v=20260831">
    <script src="../space-lab.js?v=20260831" defer></script>
    <title>Infinite Pannable Canvas · Motion Field 19</title>
</head>
<body data-effect="infinite-canvas">
    <a class="skip-link" href="#experiment">跳到实验区</a>
    <header class="lab-nav">
        <a href="../" aria-label="返回 Motion Field 总览">← <span>Motion Field</span></a>
        <p><i></i> Infinite Pannable Canvas</p>
        <b aria-label="第十九个实验，共四十四个">19 / 44</b>
    </header>

    <main class="infinite-lab" id="experiment">
        <div class="infinite-viewport" data-infinite-viewport tabindex="0" aria-label="可拖动的无限画布，也可以使用方向键或滚轮移动">
            <div class="infinite-plane" data-infinite-plane aria-hidden="true">
                <figure class="canvas-tile tile-photo tile-wide"><img src="../assets/bg8-720.webp" alt="" draggable="false"><figcaption>01 / ECHO FIELD</figcaption></figure>
                <figure class="canvas-tile tile-word"><strong>NO<br>EDGE</strong><span>∞</span></figure>
                <figure class="canvas-tile tile-photo"><img src="../assets/bg9-720.webp" alt="" draggable="false"><figcaption>02 / ORBITAL</figcaption></figure>
                <figure class="canvas-tile tile-data"><span>X—19</span><strong>DRAG</strong><small>TO NAVIGATE</small></figure>
                <figure class="canvas-tile tile-photo tile-tall"><img src="../assets/bg0-720.webp" alt="" draggable="false"><figcaption>03 / SIGNAL</figcaption></figure>
                <figure class="canvas-tile tile-ring"><i></i><b>FIELD<br>NOTES</b></figure>
                <figure class="canvas-tile tile-photo"><img src="../assets/bg11-720.webp" alt="" draggable="false"><figcaption>04 / TIDE</figcaption></figure>
                <figure class="canvas-tile tile-word tile-acid"><strong>KEEP<br>MOVING</strong><span>↗</span></figure>
                <figure class="canvas-tile tile-photo tile-wide"><img src="../assets/bg9-720.webp" alt="" draggable="false"><figcaption>05 / REPEAT</figcaption></figure>
                <figure class="canvas-tile tile-data"><span>GRID—04</span><strong>LOOP</strong><small>SEAMLESS SPACE</small></figure>
                <figure class="canvas-tile tile-photo"><img src="../assets/bg8-720.webp" alt="" draggable="false"><figcaption>06 / RETURN</figcaption></figure>
                <figure class="canvas-tile tile-ring tile-coral"><i></i><b>MAP<br>ZERO</b></figure>
            </div>
            <div class="canvas-origin" aria-hidden="true"><span></span><b data-canvas-x>X +000</b><b data-canvas-y>Y +000</b></div>
            <div class="edge-vignette" aria-hidden="true"></div>
        </div>

        <section class="lab-copy copy-bottom-left">
            <p class="lab-kicker">EXPERIMENT 19 · SPATIAL UI</p>
            <h1>INFINITE<br><em>CANVAS</em></h1>
            <p>按住拖动、滑动触摸屏或滚动鼠标。图块会跨过边界重新出现，让有限内容变成一张连续地图。</p>
        </section>
        <p class="gesture-chip"><span aria-hidden="true">↔</span><b data-infinite-status>DRAG / WHEEL / ARROW KEYS</b></p>
        <a class="lab-next" href="../inertial-drag/"><small>NEXT 20</small><span>Inertial Drag</span> ↗</a>
    </main>
    <noscript><p class="no-script">启用 JavaScript 后即可拖动画布。</p></noscript>
</body>
</html>
