        <section class="lab-copy" aria-labelledby="page-title">

        <div class="mask-frame" data-mask-frame>

                <defs><mask id="spotlight-mask"><rect width="1000" height="700" fill="black"/><circle class="mask-circle" data-mask-circle cx="620" cy="336" r="150" fill="white"/></mask></defs>

            </svg>
            <i class="mask-ring" data-mask-ring aria-hidden="true"></i>
