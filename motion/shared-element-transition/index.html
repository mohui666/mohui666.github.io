    <link rel="icon" href="../../images/cover.ico" type="image/x-icon">

    <link rel="stylesheet" href="../light-lab.css">

<body data-effect="shared">
    <a class="skip-link" href="#experiment">跳到实验区</a>
    <header class="lab-nav">
        <a class="back-link" href="../" aria-label="返回 Motion Field 总览"><span aria-hidden="true">←</span><span>Motion Field</span></a>
        <p class="lab-title"><i aria-hidden="true"></i> Shared Element Transition</p>
        <p class="lab-count" aria-label="第十八个实验，共三十四个">18 / 34</p>

    <main class="lab-stage shared-stage" id="experiment">
        <section class="lab-copy" aria-labelledby="page-title">
            <p class="eyebrow"><span>18</span> IDENTITY / CONTINUITY / DETAIL</p>
            <h1 id="page-title">SHARED<br><em>ELEMENT</em></h1>
            <p class="description">缩略图不是消失后换成另一张图，而是保持视觉身份，跨越两个布局连续飞入详情。点击任意画面，Esc 返回。</p>
        </section>
        <div class="shared-gallery" aria-label="选择一张图片进入详情">
            <button class="shared-card" type="button" data-shared-card data-title="Echo Chamber" data-index="01 / ECHO"><img src="../assets/bg8-720.webp" alt="Echo Chamber 蓝紫色抽象空间"><span><b>01</b><b>ECHO CHAMBER ↗</b></span></button>
            <button class="shared-card" type="button" data-shared-card data-title="Solar Flare" data-index="02 / FLARE"><img src="../assets/bg9-720.webp" alt="Solar Flare 暖色抽象空间"><span><b>02</b><b>SOLAR FLARE ↗</b></span></button>
            <button class="shared-card" type="button" data-shared-card data-title="Tidal Memory" data-index="03 / TIDE"><img src="../assets/bg0-720.webp" alt="Tidal Memory 绿色抽象空间"><span><b>03</b><b>TIDAL MEMORY ↗</b></span></button>
            <button class="shared-card" type="button" data-shared-card data-title="Dark Signal" data-index="04 / VOID"><img src="../assets/bg11-720.webp" alt="Dark Signal 深色流体纹理"><span><b>04</b><b>DARK SIGNAL ↗</b></span></button>
        </div>
    </main>

    <div class="shared-dialog" data-shared-dialog role="dialog" aria-modal="true" aria-labelledby="shared-title" hidden>
        <article class="shared-detail">
            <button class="dialog-close" type="button" data-dialog-close aria-label="关闭详情">×</button>
            <img data-detail-image src="../assets/bg8-720.webp" alt="">
            <div class="shared-detail-copy"><p data-detail-index>01 / ECHO</p><h2 id="shared-title" data-detail-title>Echo Chamber</h2><p>同一个视觉元素跨越缩略图与详情布局，运动轨迹承担了空间关系的解释工作。</p></div>
        </article>
    </div>

    <footer class="lab-footer">
        <p><span class="live-dot" aria-hidden="true"></span><span data-live-state>SELECT AN IMAGE</span></p>
        <p class="method">SOURCE → CLONE → TARGET</p>
        <a class="next-link" href="../infinite-canvas/"><span><small>NEXT 19</small>Infinite Canvas</span><b aria-hidden="true">↗</b></a>
