<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Direction-Aware Marquee Hover 方向感知跑马灯：进入方向决定文字流动方向。">
    <meta name="theme-color" content="#0a0b0d">
    <link rel="icon" href="../../images/cover.ico" type="image/x-icon">
    <link rel="stylesheet" href="../light-lab.css?v=20260831-ui">
    <script src="../light-lab.js?v=20260831-ui" defer></script>
    <title>Direction-Aware Marquee · Motion Field 10</title>
    <link rel="stylesheet" href="../ui-shell.css?v=20260831-ui">
</head>
<body data-effect="marquee">
    <a class="skip-link" href="#experiment">跳到实验区</a>
    <header class="lab-nav">
        <a class="back-link" href="../" aria-label="返回 Motion Field 总览"><span aria-hidden="true">←</span><span>Motion Field</span></a>
        <p class="lab-title"><i aria-hidden="true"></i> Direction-Aware Marquee</p>
        <p class="lab-count" aria-label="第 10 个实验，共 44 个">10 / 44</p>
    </header>

    <main class="lab-stage marquee-stage" id="experiment">
        <section class="lab-copy" aria-labelledby="page-title">
            <p class="eyebrow"><span>10</span> ENTER / FLOW / REVERSE</p>
            <h1 id="page-title">MARQUEE<br><em>HOVER</em></h1>
            <p class="description">从文字带左半侧或右半侧进入，排版会向相应方向启动。聚焦后使用左右方向键也能指定流向。</p>
        </section>
        <div class="marquee-stack" role="group" aria-label="方向感知跑马灯">
            <button class="marquee-band" type="button" data-marquee-band data-direction="left"><span class="marquee-track"><span>ENERGY IN MOTION — </span><span>ENERGY IN MOTION — </span></span></button>
            <button class="marquee-band" type="button" data-marquee-band data-direction="right"><span class="marquee-track"><span>DIRECTION IS DATA — </span><span>DIRECTION IS DATA — </span></span></button>
            <button class="marquee-band" type="button" data-marquee-band data-direction="left"><span class="marquee-track"><span>HOVER TO RELEASE — </span><span>HOVER TO RELEASE — </span></span></button>
        </div>
        <p class="marquee-hint">ENTER LEFT / ENTER RIGHT</p>
    </main>

    <footer class="lab-footer">
        <p><span class="live-dot" aria-hidden="true"></span><span data-live-state>ENTER A TYPE BAND</span></p>
        <p class="method">ENTRY → DIRECTION → SPEED</p>
        <a class="next-link" href="../tilt-hover/" aria-label="前往下一个实验：Tilt Hover / Pointer Parallax"><span><small>NEXT · 11 / 44</small>Tilt Hover</span><b aria-hidden="true">↗</b></a>
    </footer>
    <noscript><p class="no-script">启用 JavaScript 后，文字方向会响应进入位置。</p></noscript>
</body>
</html>
