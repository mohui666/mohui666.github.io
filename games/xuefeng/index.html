<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>雪峰冲刺｜原创浏览器跑酷</title>
<style>
  /* 毛玻璃设计令牌：与 css/style.css、css/subpage.css 同源 */
  :root{
    --bg:#0c1122;--ink:#f4f6fb;--muted:rgba(226,232,246,0.68);
    --glass:rgba(255,255,255,0.08);--glass-soft:rgba(255,255,255,0.05);--glass-strong:rgba(255,255,255,0.13);
    --glass-border:rgba(255,255,255,0.16);--glass-border-bright:rgba(255,255,255,0.32);
    --accent:#a5b4fc;--accent-2:#7dd3fc;--accent-3:#f0abfc;
    --radius-lg:28px;--radius-md:20px;--radius-sm:14px;
    --blur:blur(26px) saturate(1.6);
    --shadow:0 24px 60px rgba(3,7,22,0.45);
    --inner-light:inset 0 1px 0 rgba(255,255,255,0.22),inset 0 -1px 0 rgba(255,255,255,0.05);
    --ease:cubic-bezier(0.22,0.9,0.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{display:grid;place-items:center;touch-action:none;background-color:var(--bg);color:var(--ink);font-family:"Inter","SF Pro Display","Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
  /* 深蓝紫底色 + 氛围光晕，衬托玻璃机身 */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(42rem 30rem at 84% -6%,rgba(125,211,252,0.15),transparent 65%),
      radial-gradient(40rem 30rem at -8% 104%,rgba(240,171,252,0.12),transparent 65%),
      radial-gradient(34rem 26rem at 52% 46%,rgba(165,180,252,0.08),transparent 70%),
      linear-gradient(160deg,#141b36,#0c1122 55%,#141028);
  }
  ::selection{color:#101430;background:var(--accent)}
  :focus-visible{outline:2px solid rgba(255,255,255,0.65);outline-offset:3px;border-radius:6px}
  /* 游戏机身：大块玻璃面板 */
  #shell{
    position:relative;width:min(100vw - 24px,1180px);aspect-ratio:16/9;max-height:calc(100vh - 24px);overflow:hidden;
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    background:linear-gradient(150deg,rgba(255,255,255,0.13),rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.09));
    box-shadow:var(--shadow),var(--inner-light);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  }
  /* 玻璃顶部斜向高光 */
  #shell::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,0.10),rgba(255,255,255,0) 36%)}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#101a38}
  #hud{position:absolute;inset:0;pointer-events:none;padding:clamp(14px,2.2vw,26px);display:flex;align-items:flex-start;justify-content:space-between;font-weight:800;letter-spacing:-0.01em;text-shadow:0 2px 18px rgba(3,7,22,0.55)}
  #hud .brand{
    font-size:clamp(15px,2.2vw,28px);letter-spacing:-0.03em;text-shadow:none;
    color:transparent;background:linear-gradient(95deg,var(--accent-2),var(--accent) 48%,var(--accent-3));
    background-clip:text;-webkit-background-clip:text;
    filter:drop-shadow(0 2px 14px rgba(165,180,252,0.4));
  }
  #hud .score{text-align:right;font-size:clamp(13px,1.8vw,24px);line-height:1.45;font-variant-numeric:tabular-nums}
  #hud .score div:last-child{color:var(--muted);font-size:.74em}
  /* 速度条：玻璃药丸 */
  #meter{
    position:absolute;left:50%;top:clamp(16px,2.4vw,30px);transform:translateX(-50%);width:min(32vw,320px);height:12px;pointer-events:none;overflow:hidden;
    border:1px solid rgba(255,255,255,0.35);border-radius:999px;background:rgba(12,17,34,0.35);
    box-shadow:inset 0 1px 2px rgba(3,7,22,0.4),0 6px 18px rgba(3,7,22,0.3);
    backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);
  }
  #meter>i{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent) 55%,var(--accent-3));box-shadow:0 0 12px rgba(165,180,252,0.55)}
  /* 覆盖层：暗纱 + 毛玻璃卡片 */
  .panel{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;text-align:center;background:linear-gradient(180deg,rgba(8,12,26,0.34),rgba(8,12,26,0.58))}
  .card{
    position:relative;width:min(92%,620px);padding:clamp(24px,4vw,46px);color:var(--ink);
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    background:linear-gradient(150deg,rgba(255,255,255,0.13),rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.09));
    box-shadow:var(--shadow),var(--inner-light);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  }
  /* 卡片顶部斜向高光 */
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,0.13),rgba(255,255,255,0) 40%)}
  h1{
    margin:0 0 12px;font-size:clamp(34px,7vw,72px);font-weight:800;line-height:1.04;letter-spacing:-0.03em;
    color:transparent;background:linear-gradient(95deg,var(--accent-2),var(--accent) 48%,var(--accent-3));
    background-clip:text;-webkit-background-clip:text;
    filter:drop-shadow(0 4px 22px rgba(165,180,252,0.35));
  }
  .sub{margin-bottom:18px;color:var(--accent);font-size:clamp(13px,1.8vw,18px);font-weight:700;letter-spacing:0.18em}
  .help{margin:16px 0 24px;color:var(--muted);font-size:clamp(12px,1.5vw,16px);line-height:1.9}
  /* 主按钮：白玻璃药丸 */
  button{
    appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 34px;
    border:1px solid rgba(255,255,255,0.7);border-radius:999px;color:#101430;
    background:linear-gradient(180deg,#ffffff,#e6ecff);
    box-shadow:0 14px 34px rgba(10,16,40,0.4),inset 0 1px 0 rgba(255,255,255,0.9);
    font-family:inherit;font-size:clamp(15px,2vw,19px);font-weight:800;letter-spacing:0.04em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform 220ms var(--ease),box-shadow 220ms ease,background 220ms ease,border-color 220ms ease;
  }
  button:hover,button:focus-visible{transform:translateY(-2px);background:#ffffff;box-shadow:0 18px 44px rgba(10,16,40,0.5),inset 0 1px 0 #ffffff}
  button:active{transform:translateY(1px) scale(0.99);box-shadow:0 8px 20px rgba(10,16,40,0.45),inset 0 1px 0 rgba(255,255,255,0.85)}
  #gameOver{display:none}
  /* 触屏按钮：玻璃幽灵药丸 */
  #touch{position:absolute;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;z-index:25;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  #touch button{
    pointer-events:auto;width:96px;min-height:0;height:58px;padding:0;opacity:.92;
    color:var(--ink);border:1px solid var(--glass-border-bright);background:var(--glass);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.2),0 10px 26px rgba(3,7,22,0.35);
    backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
    font-size:14px;font-weight:700;letter-spacing:0.08em;user-select:none;-webkit-user-select:none;
  }
  #touch button:hover,#touch button:focus-visible{background:var(--glass-strong);border-color:rgba(255,255,255,0.5);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 12px 30px rgba(3,7,22,0.4)}
  #touch button:active{transform:translateY(1px) scale(0.98);background:var(--glass-strong)}
  #touch .right{display:flex;gap:12px}
  .tiny{margin-top:18px;color:var(--muted);font-size:12px}
  /* 不支持 backdrop-filter 时的实底回退 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    #shell,.card{background:rgba(18,24,46,0.88)}
    #meter{background:rgba(12,17,34,0.6)}
    #touch button{background:rgba(18,24,46,0.7)}
  }
  @media (hover:none),(pointer:coarse){#touch{display:flex}.help .desktop{display:none}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="960" height="540" aria-label="雪峰冲刺跑酷游戏"></canvas>
  <div id="hud">
    <div class="brand">雪峰冲刺</div>
    <div class="score"><div id="score">00000</div><div>HI <span id="hi">00000</span></div></div>
  </div>
  <div id="meter"><i></i></div>

  <section id="start" class="panel">
    <div class="card">
      <h1>雪峰<br>冲刺</h1>
      <div class="sub">原创像素风无尽跑酷</div>
      <div class="help">
        <span class="desktop">空格 / ↑ / W：跳跃，长按跳得更高<br>↓ / S：下蹲，R：重新开始</span>
        <span>跳过路障，蹲过飞来的汽水罐，坚持越久速度越快。</span>
      </div>
      <button id="startBtn">开始冲刺</button>
      <div class="tiny">使用原创图形与程序，不含原游戏素材。</div>
    </div>
  </section>

  <section id="gameOver" class="panel">
    <div class="card">
      <div class="sub">本次冲刺结束</div>
      <h1 id="finalScore">00000</h1>
      <div class="help" id="comment">再来一次，节奏会更稳。</div>
      <button id="retryBtn">重新开始</button>
    </div>
  </section>

  <div id="touch">
    <button id="duckBtn">下蹲</button>
    <div class="right"><button id="jumpBtn">跳跃</button></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W=960,H=540,GROUND=416;
  const scoreEl=document.getElementById('score'), hiEl=document.getElementById('hi');
  const startPanel=document.getElementById('start'), overPanel=document.getElementById('gameOver');
  const meter=document.querySelector('#meter i');
  const finalScore=document.getElementById('finalScore'), comment=document.getElementById('comment');
  let high=Number(localStorage.getItem('xuefengRunnerHi')||0); hiEl.textContent=fmt(high);

  const state={running:false,dead:false,t:0,score:0,speed:330,spawn:1.0,shake:0,flash:0};
  const input={jump:false,duck:false,jumpPressed:false};
  const player={x:150,y:GROUND-82,w:50,h:82,vy:0,onGround:true,ducking:false,run:0,coyote:0};
  let obstacles=[], particles=[], clouds=[];
  for(let i=0;i<7;i++) clouds.push({x:Math.random()*W,y:55+Math.random()*155,s:0.7+Math.random()*1.6});

  let audio=null;
  function beep(freq,dur,type='square',vol=.035,slide=0){
    try{
      audio ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audio.createOscillator(), g=audio.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
      o.frequency.linearRampToValueAtTime(freq+slide,audio.currentTime+dur);
      g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);
      o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
    }catch(e){}
  }

  function fmt(n){return String(Math.floor(n)).padStart(5,'0').slice(-5)}
  function reset(){
    state.running=true;state.dead=false;state.t=0;state.score=0;state.speed=330;state.spawn=.95;state.shake=0;state.flash=0;
    Object.assign(player,{x:150,y:GROUND-82,w:50,h:82,vy:0,onGround:true,ducking:false,run:0,coyote:0});
    obstacles=[];particles=[];overPanel.style.display='none';startPanel.style.display='none';
    scoreEl.textContent='00000';meter.style.width='0%';beep(220,.07,'square',.03,90);
  }
  function die(){
    if(state.dead)return;
    state.dead=true;state.running=false;state.shake=14;state.flash=1;
    beep(180,.35,'sawtooth',.055,-120);
    for(let i=0;i<28;i++) particles.push({x:player.x+25,y:player.y+35,vx:(Math.random()-.5)*360,vy:-Math.random()*360-30,life:.5+Math.random()*.6,size:4+Math.random()*8,c:'#f0abfc'});
    const s=Math.floor(state.score);
    if(s>high){high=s;localStorage.setItem('xuefengRunnerHi',high);hiEl.textContent=fmt(high)}
    setTimeout(()=>{
      finalScore.textContent=fmt(s);
      comment.textContent=s<500?'先熟悉跳跃高度：轻按是小跳，长按是大跳。':s<1500?'节奏不错。注意空中汽水罐必须下蹲。':'速度已经很快，这一局相当稳。';
      overPanel.style.display='grid';
    },520);
  }

  function spawnObstacle(){
    const difficulty=Math.min(1,state.score/1800);
    const r=Math.random();
    if(r<.37){
      obstacles.push({type:'crate',x:W+50,y:GROUND-58,w:52,h:58,passed:false});
    }else if(r<.68){
      obstacles.push({type:'books',x:W+50,y:GROUND-42,w:74,h:42,passed:false});
    }else{
      obstacles.push({type:'can',x:W+50,y:GROUND-94-(Math.random()<.25?10:0),w:50,h:32,passed:false,spin:0});
    }
    state.spawn=(1.02+Math.random()*.72)*(1-difficulty*.25);
  }

  function jumpStart(){
    if((player.onGround||player.coyote>0)&&!player.ducking){
      player.vy=-660;player.onGround=false;player.coyote=0;beep(390,.08,'square',.03,110);
      for(let i=0;i<8;i++) particles.push({x:player.x+18+Math.random()*25,y:GROUND-5,vx:-50-Math.random()*150,vy:-20-Math.random()*100,life:.25+Math.random()*.2,size:3+Math.random()*5,c:'#dbe6ff'});
    }
  }

  function update(dt){
    state.t+=dt;
    if(state.flash>0)state.flash=Math.max(0,state.flash-dt*3.2);
    if(state.shake>0)state.shake=Math.max(0,state.shake-dt*34);
    clouds.forEach(c=>{c.x-=dt*(12+state.speed*.025)*c.s;if(c.x<-180)c.x=W+100+Math.random()*220});

    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life-=dt});
    particles=particles.filter(p=>p.life>0);
    if(!state.running)return;

    state.score+=dt*100*(state.speed/330);
    state.speed=Math.min(680,330+state.score*.095);
    scoreEl.textContent=fmt(state.score);
    meter.style.width=(Math.min(100,state.score/20))+'%';

    player.ducking=input.duck&&player.onGround;
    player.h=player.ducking?48:82;
    player.w=player.ducking?66:50;
    if(player.onGround)player.y=GROUND-player.h;
    if(input.jumpPressed){jumpStart();input.jumpPressed=false}

    const gravity=(input.jump&&player.vy<0)?1450:2450;
    player.vy+=gravity*dt;
    player.y+=player.vy*dt;
    if(player.y+player.h>=GROUND){
      if(!player.onGround&&player.vy>220){
        beep(120,.035,'square',.018,0);
        for(let i=0;i<5;i++)particles.push({x:player.x+15+Math.random()*30,y:GROUND-3,vx:-30-Math.random()*100,vy:-20-Math.random()*70,life:.18+Math.random()*.14,size:3+Math.random()*4,c:'#dbe6ff'});
      }
      player.y=GROUND-player.h;player.vy=0;player.onGround=true;player.coyote=.08;
    }else{player.coyote=Math.max(0,player.coyote-dt);player.onGround=false}
    player.run+=dt*(state.speed/54);

    state.spawn-=dt;
    if(state.spawn<=0)spawnObstacle();
    obstacles.forEach(o=>{
      o.x-=state.speed*dt;
      if(o.spin!==undefined)o.spin+=dt*8;
      if(!o.passed&&o.x+o.w<player.x){o.passed=true;state.score+=25;beep(760,.035,'square',.012,50)}
    });
    obstacles=obstacles.filter(o=>o.x>-120);

    const px=player.x+8,py=player.y+6,pw=player.w-16,ph=player.h-8;
    for(const o of obstacles){
      const ox=o.x+5,oy=o.y+4,ow=o.w-10,oh=o.h-8;
      if(px<ox+ow&&px+pw>ox&&py<oy+oh&&py+ph>oy){die();break}
    }
  }

  function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
  function text(str,x,y,size,align='left',color='#101430'){
    ctx.fillStyle=color;ctx.font=`900 ${size}px "Inter","Segoe UI","Microsoft YaHei","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);
  }

  function drawBackground(){
    const dusk=Math.min(1,state.score/3500), sky=`rgb(${Math.round(100-76*dusk)},${Math.round(138-108*dusk)},${Math.round(196-132*dusk)})`;
    rect(0,0,W,H,sky);
    ctx.beginPath();ctx.arc(790,92,38,0,Math.PI*2);ctx.fillStyle=dusk>.55?'#e9edff':'#f0abfc';ctx.fill();
    clouds.forEach(c=>{
      const x=c.x,y=c.y,s=c.s;ctx.fillStyle='#eef2ffcc';
      ctx.fillRect(x,y,72*s,20*s);ctx.fillRect(x+14*s,y-13*s,28*s,18*s);ctx.fillRect(x+38*s,y-8*s,25*s,15*s);
    });
    const off=-(state.t*state.speed*.06)%240;
    ctx.fillStyle=dusk>.55?'#2b3156':'#5b74ad';
    for(let x=off-240;x<W+240;x+=240){
      ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+105,240);ctx.lineTo(x+210,GROUND);ctx.fill();
    }
    ctx.fillStyle=dusk>.55?'#1f2547':'#48598f';
    const off2=-(state.t*state.speed*.13)%180;
    for(let x=off2-180;x<W+180;x+=180){
      ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+75,310);ctx.lineTo(x+165,GROUND);ctx.fill();
    }
    ctx.fillStyle=dusk>.55?'#161b36':'#33436e';
    const cityOff=-(state.t*state.speed*.24)%110;
    for(let x=cityOff-110,i=0;x<W+110;x+=110,i++){
      const bh=50+(i%4)*18;rect(x,GROUND-bh,78,bh,ctx.fillStyle);rect(x+80,GROUND-bh*.7,25,bh*.7,ctx.fillStyle);
      if(dusk>.45){ctx.fillStyle='#a5b4fc';for(let wy=GROUND-bh+12;wy<GROUND-12;wy+=18)for(let wx=x+12;wx<x+65;wx+=20)rect(wx,wy,6,7,ctx.fillStyle);ctx.fillStyle=dusk>.55?'#161b36':'#33436e'}
    }
    rect(0,GROUND,W,H-GROUND,dusk>.55?'#12172e':'#242b4a');
    rect(0,GROUND,W,7,'#eef2ff');
    const stripe=-(state.t*state.speed)%96;
    for(let x=stripe-96;x<W+96;x+=96)rect(x,GROUND+34,56,8,'#7dd3fc');
    ctx.globalAlpha=Math.min(.42,(state.speed-330)/700);
    for(let i=0;i<14;i++){const yy=50+(i*37+state.t*210)%(GROUND-100);const xx=(i*173-state.t*state.speed*1.4)%W;rect(xx,yy,45+i%3*24,2,'#eef2ff')}
    ctx.globalAlpha=1;
  }

  function drawPlayer(){
    const x=Math.round(player.x),y=Math.round(player.y);ctx.save();
    if(state.dead){ctx.translate(x+25,y+40);ctx.rotate(-.8);ctx.translate(-25,-40)}
    if(player.ducking){
      rect(x+8,y+36,22,10,'#101430');rect(x+34,y+36,24,10,'#101430');
      rect(x+10,y+10,48,29,'#31497f');rect(x+14,y+13,10,24,'#7dd3fc');
      rect(x+1,y+2,25,25,'#e2b389');rect(x+3,y,22,7,'#101430');rect(x+19,y+11,5,4,'#101430');
    }else{
      const step=Math.sin(player.run)*7*(player.onGround?1:0);
      rect(x+25,y+58,14,20+Math.max(0,-step),'#2a3760');rect(x+25,y+75-step,25,9,'#101430');
      rect(x+10,y+58,14,20+Math.max(0,step),'#3d5492');rect(x+2,y+75+step,24,9,'#101430');
      rect(x+8,y+29,34,35,'#31497f');rect(x+12,y+31,8,30,'#7dd3fc');rect(x+28,y+29,9,18,'#eef2ff');
      rect(x+35,y+35+step*.35,13,9,'#31497f');rect(x+45,y+36+step*.35,9,8,'#e2b389');
      rect(x+10,y+5,27,27,'#e2b389');rect(x+9,y+2,29,8,'#101430');rect(x+31,y+15,5,4,'#101430');
      rect(x+23,y+13,15,3,'#101430');rect(x+27,y+10,3,8,'#101430');
    }
    ctx.restore();
  }

  function drawObstacle(o){
    const x=Math.round(o.x),y=Math.round(o.y);
    if(o.type==='crate'){
      rect(x,y,o.w,o.h,'#3c4470');rect(x+5,y+5,o.w-10,o.h-10,'#4d5890');rect(x+9,y+8,6,o.h-16,'#2b3157');rect(x+o.w-15,y+8,6,o.h-16,'#2b3157');
      text('卷',x+o.w/2,y+o.h/2+1,19,'center','#eef2ff');
    }else if(o.type==='books'){
      rect(x,y+24,74,18,'#f0abfc');rect(x+7,y+8,61,17,'#a5b4fc');rect(x+15,y,54,10,'#eef2ff');
      rect(x+6,y+28,9,4,'#101430');rect(x+60,y+12,6,4,'#101430');
    }else{
      ctx.save();ctx.translate(x+o.w/2,y+o.h/2);ctx.rotate(Math.sin(o.spin)*.13);
      rect(-24,-14,48,28,'#7dd3fc');rect(-18,-14,36,5,'#eef6ff');rect(-18,9,36,5,'#eef6ff');
      text('汽水',0,1,12,'center','#101430');ctx.restore();
    }
  }

  function render(){
    ctx.save();
    const sx=state.shake?(Math.random()-.5)*state.shake:0,sy=state.shake?(Math.random()-.5)*state.shake:0;ctx.translate(sx,sy);
    drawBackground();obstacles.forEach(drawObstacle);drawPlayer();
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*1.6);rect(p.x,p.y,p.size,p.size,p.c)});ctx.globalAlpha=1;
    ctx.restore();
    if(state.flash>0){ctx.globalAlpha=state.flash*.55;rect(0,0,W,H,'#eef2ff');ctx.globalAlpha=1}
  }

  let last=performance.now();
  function frame(now){const dt=Math.min(.032,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);

  function down(code){
    if(['Space','ArrowUp','KeyW'].includes(code)){if(!input.jump){input.jumpPressed=true}input.jump=true}
    if(['ArrowDown','KeyS'].includes(code))input.duck=true;
    if(code==='KeyR'&&state.dead)reset();
  }
  function up(code){if(['Space','ArrowUp','KeyW'].includes(code))input.jump=false;if(['ArrowDown','KeyS'].includes(code))input.duck=false}
  addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();down(e.code)});
  addEventListener('keyup',e=>up(e.code));
  addEventListener('blur',()=>{input.jump=false;input.duck=false});
  document.getElementById('startBtn').onclick=reset;document.getElementById('retryBtn').onclick=reset;

  function bindHold(el,on,off){
    const a=e=>{e.preventDefault();on()};const b=e=>{e.preventDefault();off()};
    el.addEventListener('pointerdown',a);el.addEventListener('pointerup',b);el.addEventListener('pointercancel',b);el.addEventListener('pointerleave',b);
  }
  bindHold(document.getElementById('jumpBtn'),()=>{if(!input.jump)input.jumpPressed=true;input.jump=true},()=>input.jump=false);
  bindHold(document.getElementById('duckBtn'),()=>input.duck=true,()=>input.duck=false);
})();
</script>
</body>
</html>
